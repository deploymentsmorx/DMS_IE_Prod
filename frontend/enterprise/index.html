<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocShare Enterprise</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Login -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h1>DocShare Enterprise</h1>
      <p>AI Document Management System</p>
      <div class="form-group"><label>Email</label><input type="email" id="loginEmail" value="admin@docshare.local" /></div>
      <div class="form-group"><label>Password</label><input type="password" id="loginPassword" value="admin123" /></div>
      <button class="btn-primary full" id="loginBtn">Sign in</button>
      <p class="login-hint">Demo: admin@docshare.local / admin123</p>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <aside class="nav-sidebar">
      <div class="nav-brand">
        <span class="brand-icon">◆</span>
        <div><strong>DocShare</strong><small>Enterprise</small></div>
      </div>
      <div class="nav-user" id="navUser"></div>
      <nav class="nav-menu" id="navMenu"></nav>
      <div class="nav-status"><span class="live-dot" id="liveDot"></span><span id="liveLabel">Connecting…</span></div>
    </aside>
    <main class="main-panel">
      <header class="module-header" id="moduleHeader"></header>
      <section class="module-body" id="moduleBody"></section>
    </main>
  </div>

  <div class="toast" id="toast" style="display:none"></div>
  <div class="modal-overlay" id="modalOverlay" style="display:none"><div class="modal" id="modal"></div></div>

  <script src="js/core.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
